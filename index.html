<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cakra Quiz System</title>
    <style>
        /* CSS LANGSUNG DI SINI */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff; /* Sesuai request: Solid Putih */
            margin: 0;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        .hidden { display: none; }

        .menu-box button {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 18px;
            cursor: pointer;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            transition: 0.3s;
        }

        .menu-box button:hover { background-color: #e2e6ea; }

        .question-card {
            background: #fdffdf;
            padding: 20px;
            margin: 20px 0;
            border-left: 10px solid #333;
            text-align: left;
        }

        .q-input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .answers-grid input {
            display: block;
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
        }

        .controls { margin-bottom: 20px; }
        
        .btn-opt { background: #6c757d; color: white; border: none; padding: 5px 10px; cursor: pointer; }
        .btn-save { background: #28a745; color: white; padding: 15px; width: 100%; border: none; cursor: pointer; font-size: 18px; }
        .btn-back { float: left; cursor: pointer; border: none; background: none; font-size: 16px; color: blue; }
        
        #questions-list { max-height: 500px; overflow-y: auto; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- LOBBY -->
    <div id="lobby" class="container">
        <h1>Quiz Lobby</h1>
        <div class="menu-box">
            <button onclick="showScreen('join-screen')">Masukan IP Quiz</button>
            <button onclick="showScreen('create-screen')">Buat Soal Quiz</button>
        </div>
    </div>

    <!-- JOIN SCREEN -->
    <div id="join-screen" class="container hidden">
        <button onclick="showScreen('lobby')" class="btn-back">← Kembali</button>
        <h2>Join Quiz</h2>
        <p>Masukkan IP yang diberikan oleh pembuat kuis.</p>
        <input type="number" id="quiz-ip" placeholder="Contoh: 123456" style="padding:10px; width:80%;">
        <button onclick="joinQuiz()" style="padding:10px 20px; cursor:pointer;">Masuk</button>
    </div>

    <!-- CREATOR SCREEN -->
    <div id="create-screen" class="container hidden">
        <button onclick="showScreen('lobby')" class="btn-back">← Kembali</button>
        <h2>Quiz Creator</h2>
        
        <div class="controls">
            <input type="text" id="quiz-title" placeholder="Judul Quiz" class="q-input">
            <button onclick="addQuestion()" id="btnAdd">+ Tambah Soal (Maks 100)</button>
        </div>
        
        <div id="questions-list">
            <!-- Soal akan muncul di sini -->
        </div>

        <button onclick="saveAndGenerateIP()" class="btn-save">Simpan & Generate IP</button>
    </div>

    <script>
        /* JAVASCRIPT LANGSUNG DI SINI */
        let questionCount = 0;

        function showScreen(screenId) {
            document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
        }

        function addQuestion() {
            if (questionCount >= 100) {
                alert("Batas maksimal 100 soal tercapai!");
                return;
            }

            questionCount++;
            const list = document.getElementById('questions-list');
            
            const qDiv = document.createElement('div');
            qDiv.className = 'question-card';
            qDiv.innerHTML = `
                <h3>Soal No. ${questionCount}</h3>
                <input type="text" class="q-input" placeholder="Tulis pertanyaan...">
                <div class="answers-grid" id="ans-container-${questionCount}">
                    <p>Pilihan Jawaban:</p>
                </div>
                <button onclick="addOption(${questionCount})" class="btn-opt">+ Tambah Pilihan (Max 10)</button>
            `;
            list.appendChild(qDiv);
            
            // Berikan 2 pilihan default
            addOption(questionCount);
            addOption(questionCount);
        }

        function addOption(qId) {
            const container = document.getElementById(`ans-container-${qId}`);
            const currentOptions = container.querySelectorAll('input').length;

            if (currentOptions >= 10) {
                alert("Maksimal 10 pilihan jawaban!");
                return;
            }

            const input = document.createElement('input');
            input.type = "text";
            input.placeholder = `Pilihan ${currentOptions + 1} ${currentOptions === 0 ? '(Jawaban Benar)' : ''}`;
            container.appendChild(input);
        }

        function saveAndGenerateIP() {
            const title = document.getElementById('quiz-title').value;
            if (!title || questionCount === 0) {
                alert("Berikan judul dan minimal 1 soal!");
                return;
            }

            // Generate "IP" unik 6 digit
            const randomIP = Math.floor(100000 + Math.random() * 900000);
            alert(`Berhasil!\nKuis: ${title}\nIP QUIZ: ${randomIP}\n\nBagikan IP ini ke temanmu.`);
            location.reload(); // Reset halaman setelah simpan
        }

        function joinQuiz() {
            const ip = document.getElementById('quiz-ip').value;
            if (ip) {
                alert("Menyambungkan ke IP: " + ip + "\n(Fitur Load Data akan segera hadir!)");
            } else {
                alert("Masukkan IP kuis!");
            }
        }
    </script>
</body>
</html>
